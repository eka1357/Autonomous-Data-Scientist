name: AutoDS CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autods_user
          POSTGRES_PASSWORD: autods_password
          POSTGRES_DB: autods_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install aiosqlite pytest-asyncio

      - name: Run Ruff Linting
        run: ruff check backend/

      - name: Run Mypy Type Checking
        run: mypy backend/ --config-file backend/pyproject.toml

      - name: Run Pytest Suite
        env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://autods_user:autods_password@localhost:5432/autods_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter
        run: |
          cd frontend
          npm run lint
