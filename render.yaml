services:
  # 1. FastAPI Web Service (Backend API)
  - type: web
    name: autods-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: cd backend && alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: AutoDS
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: autods-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: autods-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://autods-frontend.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./storage

  # 2. Celery Async Background Worker
  - type: worker
    name: autods-celery-worker
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A app.worker.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: AutoDS
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        fromService:
          type: web
          name: autods-backend
          property: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: autods-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: autods-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./storage

# 3. PostgreSQL Database Instance (pgvector supported)
databases:
  - name: autods-postgres
    plan: free
    region: oregon
    databaseName: autods_db
    user: autods_user

# 4. Redis Cache & Event Broker
redis:
  - name: autods-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
